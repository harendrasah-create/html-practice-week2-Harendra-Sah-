<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico">

<body>

    <header>
        <h1>Contact Me</h1>
        <p>Feel free to get in touch</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>
            <h2>My Contact Information</h2>

            <p>
                Email:
                <a href="harendra.sah@patancollege.edu.np">
                    tkdkhiladi55@gmail.com
                </a>
            </p>

            <p>
                Website:
                <a href="https://www.w3schools.com/"
                   target="_blank">
                    e-commerce
                </a>
            </p>

            <p>
                You can also use the form below
                to send me a message.
            </p>
        </section>

        <section>
            <h2>Contact Form</h2>

            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Harendra sah"
                    required>

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="harendra.sah@patancollege.edu.np"
                    required>

                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a subject</option>
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Your Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here"
                    required></textarea>

                <button type="submit">Send Message</button>

            </form>
        </section>

        <section>
            <h2>College Location</h2>

            <iframe
                src="https://maps.google.com/maps?q=PCPS%20College%20Kupondole&t=&z=15&ie=UTF8&iwloc=&output=embed"
                width="600"
                height="400"
                title="PCPS College location"
                loading="lazy">
            </iframe>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Harendra's Portfolio</p>
    </footer>

</body>
</html>
